<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head th:replace="~{admin/layout/base :: head('管理者新規登録')}"></head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-4"
      style="background:#1a2332">

<div style="width:100%;max-width:480px;padding:1rem">

    <div class="text-center mb-4">
        <div class="text-white fs-3 fw-bold mb-1">
            <i class="bi bi-flower1 me-2"></i>Lotus Admin
        </div>
        <div class="text-white-50 small">管理者新規登録</div>
    </div>

    <div class="card p-4">

        <h5 class="fw-bold text-center mb-4">管理者アカウント登録</h5>

        <form th:action="@{/admin/register}" method="post" th:object="${form}" novalidate>

            <div class="mb-3">
                <label class="form-label small fw-semibold">
                    ログインID <span class="text-danger">*</span>
                </label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" th:field="*{loginId}"
                           th:class="${#fields.hasErrors('loginId')} ? 'form-control is-invalid' : 'form-control'"
                           placeholder="半角英数字・記号（最大50文字）">
                    <div class="invalid-feedback" th:errors="*{loginId}"></div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-semibold">
                    パスワード <span class="text-danger">*</span>
                </label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" th:field="*{password}"
                           th:class="${#fields.hasErrors('password')} ? 'form-control is-invalid' : 'form-control'"
                           placeholder="6文字以上">
                    <div class="invalid-feedback" th:errors="*{password}"></div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-semibold">
                    名前 <span class="text-danger">*</span>
                </label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                    <input type="text" th:field="*{name}"
                           th:class="${#fields.hasErrors('name')} ? 'form-control is-invalid' : 'form-control'"
                           placeholder="管理者名（最大100文字）">
                    <div class="invalid-feedback" th:errors="*{name}"></div>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-semibold">
                    メールアドレス <span class="text-danger">*</span>
                </label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" th:field="*{email}"
                           th:class="${#fields.hasErrors('email')} ? 'form-control is-invalid' : 'form-control'"
                           placeholder="example@email.com">
                    <div class="invalid-feedback" th:errors="*{email}"></div>
                </div>
            </div>

            <div class="alert alert-info small py-2 mb-4">
                <i class="bi bi-info-circle me-1"></i>
                登録時の権限は「一般管理者」になります。スーパー管理者への変更は管理者管理画面から行ってください。
            </div>

            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-primary py-2">
                    <i class="bi bi-person-plus me-1"></i>登録する
                </button>
            </div>

        </form>

        <div class="text-center">
            <a th:href="@{/admin/login}" class="small text-muted">
                <i class="bi bi-arrow-left me-1"></i>ログイン画面に戻る
            </a>
        </div>

    </div>

</div>

<th:block th:replace="~{admin/layout/base :: scripts}"></th:block>
</body>
</html>
