<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head th:replace="~{admin/layout/base :: head('管理者ログイン')}"></head>
<body class="d-flex align-items-center justify-content-center min-vh-100"
      style="background:#1a2332">

<div style="width:100%;max-width:420px;padding:1rem">

    <div class="text-center mb-4">
        <div class="text-white fs-3 fw-bold mb-1">
            <i class="bi bi-flower1 me-2"></i>Lotus Admin
        </div>
        <div class="text-white-50 small">管理サイト</div>
    </div>

    <div class="card p-4">

        <h5 class="fw-bold text-center mb-4">管理者ログイン</h5>

        <!-- 登録完了メッセージ -->
        <div th:if="${param.registered}" class="alert alert-success small py-2 mb-3">
            <i class="bi bi-check-circle me-1"></i>管理者登録が完了しました。ログインしてください。
        </div>

        <!-- ログアウトメッセージ -->
        <div th:if="${param.logout}" class="alert alert-info small py-2 mb-3">
            <i class="bi bi-info-circle me-1"></i>ログアウトしました。
        </div>

        <!-- タイムアウトメッセージ -->
        <div th:if="${param.timeout}" class="alert alert-warning small py-2 mb-3">
            <i class="bi bi-clock me-1"></i>セッションが切れました。再度ログインしてください。
        </div>

        <!-- エラーメッセージ -->
        <div th:if="${param.error}" class="alert alert-danger small py-2 mb-3">
            <i class="bi bi-exclamation-triangle me-1"></i>ログインIDまたはパスワードが正しくありません。
        </div>

        <form th:action="@{/admin/login}" method="post">

            <div class="mb-3">
                <label class="form-label small fw-semibold">ログインID</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" name="username" class="form-control"
                           placeholder="ログインIDを入力" autofocus required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-semibold">パスワード</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control"
                           placeholder="パスワードを入力" required>
                </div>
            </div>

            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-primary py-2">
                    <i class="bi bi-box-arrow-in-right me-1"></i>ログイン
                </button>
            </div>

        </form>

        <div class="text-center">
            <a th:href="@{/admin/register}" class="small text-muted">
                管理者アカウントを新規登録
            </a>
        </div>

    </div>

</div>

<th:block th:replace="~{admin/layout/base :: scripts}"></th:block>
</body>
</html>
