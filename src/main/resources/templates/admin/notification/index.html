<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ja">
<head th:replace="~{admin/layout/base :: head(title='メール通知設定', pageStyle=null)}"></head>
<body class="d-flex" style="min-height:100vh">

<div th:replace="~{admin/layout/base :: sidebar('notification')}"></div>

<div class="admin-main flex-grow-1 d-flex flex-column">
<div th:replace="~{admin/layout/base :: topbar}"></div>

<main class="p-4 flex-grow-1">

    <div class="mb-4">
        <h5 class="fw-bold mb-0">メール通知設定</h5>
        <div class="text-muted small">イベント発生時に管理者へ送信するメール通知を設定します</div>
    </div>

    <div class="row g-4">

        <!-- 申込通知 -->
        <div class="col-12">
            <div class="card">
                <div class="card-header bg-white py-3 px-4 fw-semibold">
                    <i class="bi bi-file-earmark-text me-2 text-primary"></i>申込通知
                </div>
                <div class="table-responsive">
                    <table class="table align-middle mb-0 small">
                        <thead class="table-light">
                            <tr>
                                <th class="px-4" style="width:250px">通知タイミング</th>
                                <th style="width:80px" class="text-center">送信</th>
                                <th>通知先メールアドレス</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td class="px-4">新規申込受付時</td>
                                <td class="text-center">
                                    <div class="form-check d-inline-block">
                                        <input class="form-check-input" type="checkbox" checked>
                                    </div>
                                </td>
                                <td>
                                    <input type="text" class="form-control form-control-sm"
                                           value="admin@example.com, admin_a@example.com"
                                           style="max-width:400px">
                                    <div class="form-text">複数の場合はカンマ区切り</div>
                                </td>
                            </tr>
                            <tr>
                                <td class="px-4">申込キャンセル時</td>
                                <td class="text-center">
                                    <div class="form-check d-inline-block">
                                        <input class="form-check-input" type="checkbox" checked>
                                    </div>
                                </td>
                                <td>
                                    <input type="text" class="form-control form-control-sm"
                                           value="admin@example.com"
                                           style="max-width:400px">
                                </td>
                            </tr>
                            <tr>
                                <td class="px-4">満席発生時</td>
                                <td class="text-center">
                                    <div class="form-check d-inline-block">
                                        <input class="form-check-input" type="checkbox">
                                    </div>
                                </td>
                                <td>
                                    <input type="text" class="form-control form-control-sm"
                                           placeholder="未設定"
                                           style="max-width:400px" disabled>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 問い合わせ通知 -->
        <div class="col-12">
            <div class="card">
                <div class="card-header bg-white py-3 px-4 fw-semibold">
                    <i class="bi bi-chat-dots me-2 text-success"></i>問い合わせ通知
                </div>
                <div class="table-responsive">
                    <table class="table align-middle mb-0 small">
                        <thead class="table-light">
                            <tr>
                                <th class="px-4" style="width:250px">通知タイミング</th>
                                <th style="width:80px" class="text-center">送信</th>
                                <th>通知先メールアドレス</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td class="px-4">新規問い合わせ受信時</td>
                                <td class="text-center">
                                    <div class="form-check d-inline-block">
                                        <input class="form-check-input" type="checkbox" checked>
                                    </div>
                                </td>
                                <td>
                                    <input type="text" class="form-control form-control-sm"
                                           value="admin@example.com, admin_a@example.com"
                                           style="max-width:400px">
                                </td>
                            </tr>
                            <tr>
                                <td class="px-4">未対応件数が一定数を超えた時</td>
                                <td class="text-center">
                                    <div class="form-check d-inline-block">
                                        <input class="form-check-input" type="checkbox" checked>
                                    </div>
                                </td>
                                <td>
                                    <div class="d-flex align-items-center gap-2">
                                        <input type="text" class="form-control form-control-sm"
                                               value="admin@example.com"
                                               style="max-width:300px">
                                        <span class="text-muted small flex-shrink-0">閾値：</span>
                                        <input type="number" class="form-control form-control-sm"
                                               value="10" style="width:70px">
                                        <span class="text-muted small flex-shrink-0">件</span>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- システム通知 -->
        <div class="col-12">
            <div class="card">
                <div class="card-header bg-white py-3 px-4 fw-semibold">
                    <i class="bi bi-gear me-2 text-secondary"></i>システム通知
                </div>
                <div class="table-responsive">
                    <table class="table align-middle mb-0 small">
                        <thead class="table-light">
                            <tr>
                                <th class="px-4" style="width:250px">通知タイミング</th>
                                <th style="width:80px" class="text-center">送信</th>
                                <th>通知先メールアドレス</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td class="px-4">エラー発生時（500系）</td>
                                <td class="text-center">
                                    <div class="form-check d-inline-block">
                                        <input class="form-check-input" type="checkbox" checked>
                                    </div>
                                </td>
                                <td>
                                    <input type="text" class="form-control form-control-sm"
                                           value="admin@example.com"
                                           style="max-width:400px">
                                </td>
                            </tr>
                            <tr>
                                <td class="px-4">掲載終了日が近いインフォメーションあり（7日前）</td>
                                <td class="text-center">
                                    <div class="form-check d-inline-block">
                                        <input class="form-check-input" type="checkbox" checked>
                                    </div>
                                </td>
                                <td>
                                    <input type="text" class="form-control form-control-sm"
                                           value="admin@example.com, admin_a@example.com"
                                           style="max-width:400px">
                                </td>
                            </tr>
                            <tr>
                                <td class="px-4">管理者ログイン失敗が連続した時</td>
                                <td class="text-center">
                                    <div class="form-check d-inline-block">
                                        <input class="form-check-input" type="checkbox" checked>
                                    </div>
                                </td>
                                <td>
                                    <div class="d-flex align-items-center gap-2">
                                        <input type="text" class="form-control form-control-sm"
                                               value="admin@example.com"
                                               style="max-width:300px">
                                        <span class="text-muted small flex-shrink-0">閾値：</span>
                                        <input type="number" class="form-control form-control-sm"
                                               value="5" style="width:70px">
                                        <span class="text-muted small flex-shrink-0">回</span>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <!-- 保存ボタン -->
    <div class="d-flex gap-3 mt-4">
        <button type="button" class="btn btn-primary px-5">
            <i class="bi bi-check-circle me-1"></i>設定を保存する
        </button>
        <button type="button" class="btn btn-outline-secondary px-4">
            <i class="bi bi-arrow-counterclockwise me-1"></i>リセット
        </button>
    </div>

</main>
</div>

<th:block th:replace="~{admin/layout/base :: scripts}"></th:block>
</body>
</html>
