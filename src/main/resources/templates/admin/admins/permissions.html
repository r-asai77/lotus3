<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ja">
<head th:replace="~{admin/layout/base :: head(title='権限設定', pageStyle=null)}"></head>
<body class="d-flex" style="min-height:100vh">

<div th:replace="~{admin/layout/base :: sidebar('permissions')}"></div>

<div class="admin-main flex-grow-1 d-flex flex-column">
<div th:replace="~{admin/layout/base :: topbar}"></div>

<main class="p-4 flex-grow-1">

    <div class="mb-4">
        <h5 class="fw-bold mb-0">権限設定</h5>
        <div class="text-muted small">GENERAL権限の管理者ごとにアクセスできる機能を設定します</div>
    </div>

    <div class="alert alert-info small d-flex align-items-start gap-2 mb-4">
        <i class="bi bi-info-circle-fill mt-1 flex-shrink-0"></i>
        <div>
            <strong>SUPER管理者</strong>はすべての機能に無条件でアクセスできます。<br>
            <strong>GENERAL管理者</strong>は以下の設定に基づいてアクセスが制限されます。
        </div>
    </div>

    <!-- 管理者選択タブ -->
    <div class="card mb-4">
        <div class="card-header bg-white py-2 px-4">
            <div class="d-flex align-items-center gap-3">
                <span class="small fw-semibold text-muted">対象管理者：</span>
                <div class="btn-group btn-group-sm">
                    <button class="btn btn-primary">管理者A</button>
                    <button class="btn btn-outline-secondary">管理者B</button>
                    <button class="btn btn-outline-secondary">管理者C</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 権限マトリクス -->
    <div class="card">
        <div class="card-header bg-white py-2 px-4 fw-semibold">
            <i class="bi bi-key me-2 text-warning"></i>管理者A の権限設定
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0 small">
                <thead class="table-light">
                    <tr>
                        <th class="px-4" style="width:200px">機能</th>
                        <th class="text-center" style="width:80px">閲覧</th>
                        <th class="text-center" style="width:80px">登録・編集</th>
                        <th class="text-center" style="width:80px">削除</th>
                        <th class="text-center" style="width:80px">全権限</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="px-4 fw-semibold"><i class="bi bi-file-earmark-text me-2 text-primary"></i>申込管理</td>
                        <td class="text-center"><input type="checkbox" class="form-check-input" checked></td>
                        <td class="text-center"><input type="checkbox" class="form-check-input" checked></td>
                        <td class="text-center"><input type="checkbox" class="form-check-input"></td>
                        <td class="text-center"><input type="checkbox" class="form-check-input"></td>
                    </tr>
                    <tr>
                        <td class="px-4 fw-semibold"><i class="bi bi-collection me-2 text-primary"></i>セミナー管理</td>
                        <td class="text-center"><input type="checkbox" class="form-check-input" checked></td>
                        <td class="text-center"><input type="checkbox" class="form-check-input" checked></td>
                        <td class="text-center"><input type="checkbox" class="form-check-input"></td>
                        <td class="text-center"><input type="checkbox" class="form-check-input"></td>
                    </tr>
                    <tr>
                        <td class="px-4 fw-semibold"><i class="bi bi-people me-2 text-primary"></i>ユーザー管理</td>
                        <td class="text-center"><input type="checkbox" class="form-check-input" checked></td>
                        <td class="text-center"><input type="checkbox" class="form-check-input"></td>
                        <td class="text-center"><input type="checkbox" class="form-check-input"></td>
                        <td class="text-center"><input type="checkbox" class="form-check-input"></td>
                    </tr>
                    <tr>
                        <td class="px-4 fw-semibold"><i class="bi bi-bell me-2 text-primary"></i>インフォメーション</td>
                        <td class="text-center"><input type="checkbox" class="form-check-input" checked></td>
                        <td class="text-center"><input type="checkbox" class="form-check-input" checked></td>
                        <td class="text-center"><input type="checkbox" class="form-check-input" checked></td>
                        <td class="text-center"><input type="checkbox" class="form-check-input" checked></td>
                    </tr>
                    <tr>
                        <td class="px-4 fw-semibold"><i class="bi bi-chat-dots me-2 text-primary"></i>問い合わせ</td>
                        <td class="text-center"><input type="checkbox" class="form-check-input" checked></td>
                        <td class="text-center"><input type="checkbox" class="form-check-input" checked></td>
                        <td class="text-center"><input type="checkbox" class="form-check-input"></td>
                        <td class="text-center"><input type="checkbox" class="form-check-input"></td>
                    </tr>
                    <tr>
                        <td class="px-4 fw-semibold"><i class="bi bi-question-circle me-2 text-primary"></i>FAQ</td>
                        <td class="text-center"><input type="checkbox" class="form-check-input" checked></td>
                        <td class="text-center"><input type="checkbox" class="form-check-input" checked></td>
                        <td class="text-center"><input type="checkbox" class="form-check-input" checked></td>
                        <td class="text-center"><input type="checkbox" class="form-check-input" checked></td>
                    </tr>
                    <tr>
                        <td class="px-4 fw-semibold"><i class="bi bi-shield-lock me-2 text-primary"></i>その他（管理者・設定）</td>
                        <td class="text-center"><input type="checkbox" class="form-check-input"></td>
                        <td class="text-center"><input type="checkbox" class="form-check-input"></td>
                        <td class="text-center"><input type="checkbox" class="form-check-input"></td>
                        <td class="text-center"><input type="checkbox" class="form-check-input"></td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer bg-white py-3 px-4 d-flex gap-3">
            <button type="button" class="btn btn-primary px-4">
                <i class="bi bi-check-circle me-1"></i>保存する
            </button>
            <button type="button" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-counterclockwise me-1"></i>リセット
            </button>
        </div>
    </div>

</main>
</div>

<th:block th:replace="~{admin/layout/base :: scripts}"></th:block>
</body>
</html>
