<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ユーザー登録 - Lotus</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center" style="min-height:100vh">
    <div class="card shadow" style="width:100%;max-width:480px">
        <div class="card-body p-4">
            <h4 class="card-title text-center mb-4">新規ユーザー登録</h4>

            <form th:action="@{/auth/register}" th:object="${registerForm}" method="post">
                <div class="mb-3">
                    <label class="form-label">ログインID <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{loginId}"
                           th:classappend="${#fields.hasErrors('loginId')} ? 'is-invalid'"
                           class="form-control" required>
                    <div class="invalid-feedback" th:errors="*{loginId}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">パスワード <span class="text-danger">*</span></label>
                    <input type="password" th:field="*{password}"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                           class="form-control" required>
                    <div class="invalid-feedback" th:errors="*{password}"></div>
                </div>
                <div class="row">
                    <div class="col mb-3">
                        <label class="form-label">姓 <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{lastName}"
                               th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'"
                               class="form-control" required>
                        <div class="invalid-feedback" th:errors="*{lastName}"></div>
                    </div>
                    <div class="col mb-3">
                        <label class="form-label">名 <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{firstName}"
                               th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'"
                               class="form-control" required>
                        <div class="invalid-feedback" th:errors="*{firstName}"></div>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">メールアドレス <span class="text-danger">*</span></label>
                    <input type="email" th:field="*{email}"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                           class="form-control" required>
                    <div class="invalid-feedback" th:errors="*{email}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">電話番号 <span class="text-danger">*</span></label>
                    <input type="tel" th:field="*{phoneNumber}"
                           th:classappend="${#fields.hasErrors('phoneNumber')} ? 'is-invalid'"
                           class="form-control" placeholder="09012345678" required>
                    <div class="invalid-feedback" th:errors="*{phoneNumber}"></div>
                </div>
                <button type="submit" class="btn btn-primary w-100">登録</button>
            </form>

            <hr>
            <div class="text-center">
                <a th:href="@{/auth/login}">ログインはこちら</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
