<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ログイン - Lotus</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center" style="min-height:100vh">
    <div class="card shadow" style="width:100%;max-width:420px">
        <div class="card-body p-4">
            <h4 class="card-title text-center mb-4">Lotus ログイン</h4>

            <div th:if="${param.registered}" class="alert alert-success">
                登録が完了しました。ログインしてください。
            </div>
            <div th:if="${param.logout}" class="alert alert-info">
                ログアウトしました。
            </div>
            <div th:if="${param.error}" class="alert alert-danger">
                ログインIDまたはパスワードが正しくありません。
            </div>

            <form th:action="@{/auth/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">ログインID</label>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">パスワード</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">ログイン</button>
            </form>

            <hr>
            <div class="text-center">
                <a th:href="@{/auth/register}">新規登録はこちら</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
