<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ログイン - Lotus</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: linear-gradient(135deg, #f0f4ff 0%, #e8f0fe 100%); }
        .login-card { border: none; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,.1); }
        .login-header { background: #0d6efd; color: #fff; border-radius: 12px 12px 0 0; padding: 2rem; text-align: center; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh">

<div style="width:100%;max-width:420px;padding:1rem">
    <div class="card login-card">
        <div class="login-header">
            <i class="bi bi-flower1 fs-1"></i>
            <h4 class="mt-2 mb-0 fw-bold">Lotus</h4>
            <p class="mb-0 opacity-75 small">ユーザーサイト</p>
        </div>
        <div class="card-body p-4">

            <div th:if="${param.registered}" class="alert alert-success d-flex align-items-center gap-2" role="alert">
                <i class="bi bi-check-circle-fill"></i>
                登録が完了しました。ログインしてください。
            </div>
            <div th:if="${param.logout}" class="alert alert-info d-flex align-items-center gap-2" role="alert">
                <i class="bi bi-info-circle-fill"></i>
                ログアウトしました。
            </div>
            <div th:if="${param.timeout}" class="alert alert-warning d-flex align-items-center gap-2" role="alert">
                <i class="bi bi-exclamation-triangle-fill"></i>
                セッションが切れました。再度ログインしてください。
            </div>
            <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center gap-2" role="alert">
                <i class="bi bi-x-circle-fill"></i>
                ログインIDまたはパスワードが正しくありません。
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold">ログインID</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" class="form-control" placeholder="ログインIDを入力" required autofocus>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">パスワード</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="パスワードを入力" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                    <i class="bi bi-box-arrow-in-right me-1"></i>ログイン
                </button>
            </form>

            <hr class="my-3">
            <div class="text-center small">
                <a th:href="@{/password-reset}" class="text-muted text-decoration-none">
                    <i class="bi bi-key me-1"></i>パスワードを忘れた方はこちら
                </a>
            </div>
            <div class="text-center small mt-2">
                <a th:href="@{/register}" class="text-decoration-none">
                    <i class="bi bi-person-plus me-1"></i>新規登録はこちら
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
