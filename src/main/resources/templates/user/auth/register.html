<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>新規登録 - Lotus</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: linear-gradient(135deg, #f0f4ff 0%, #e8f0fe 100%); }
        .register-card { border: none; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,.1); }
        .register-header { background: #0d6efd; color: #fff; border-radius: 12px 12px 0 0; padding: 1.5rem 2rem; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center py-4" style="min-height:100vh">

<div style="width:100%;max-width:500px;padding:1rem">
    <div class="card register-card">
        <div class="register-header d-flex align-items-center gap-2">
            <i class="bi bi-flower1 fs-4"></i>
            <div>
                <h5 class="mb-0 fw-bold">Lotus</h5>
                <p class="mb-0 opacity-75 small">新規ユーザー登録</p>
            </div>
        </div>
        <div class="card-body p-4">

            <form th:action="@{/register}" th:object="${registerForm}" method="post" novalidate>

                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        ログインID <span class="text-danger">*</span>
                    </label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" th:field="*{loginId}"
                               th:classappend="${#fields.hasErrors('loginId')} ? 'is-invalid'"
                               class="form-control" placeholder="半角英数字・50文字以内" required>
                        <div class="invalid-feedback" th:errors="*{loginId}"></div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        パスワード <span class="text-danger">*</span>
                    </label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" th:field="*{password}"
                               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                               class="form-control" placeholder="6文字以上" required>
                        <div class="invalid-feedback" th:errors="*{password}"></div>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col">
                        <label class="form-label fw-semibold">
                            姓 <span class="text-danger">*</span>
                        </label>
                        <input type="text" th:field="*{lastName}"
                               th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'"
                               class="form-control" placeholder="山田" required>
                        <div class="invalid-feedback" th:errors="*{lastName}"></div>
                    </div>
                    <div class="col">
                        <label class="form-label fw-semibold">
                            名 <span class="text-danger">*</span>
                        </label>
                        <input type="text" th:field="*{firstName}"
                               th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'"
                               class="form-control" placeholder="太郎" required>
                        <div class="invalid-feedback" th:errors="*{firstName}"></div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        メールアドレス <span class="text-danger">*</span>
                    </label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" th:field="*{email}"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                               class="form-control" placeholder="example@email.com" required>
                        <div class="invalid-feedback" th:errors="*{email}"></div>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">
                        電話番号 <span class="text-danger">*</span>
                    </label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                        <input type="tel" th:field="*{phoneNumber}"
                               th:classappend="${#fields.hasErrors('phoneNumber')} ? 'is-invalid'"
                               class="form-control" placeholder="09012345678（ハイフンなし）" required>
                        <div class="invalid-feedback" th:errors="*{phoneNumber}"></div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                    <i class="bi bi-person-check me-1"></i>登録する
                </button>
            </form>

            <hr class="my-3">
            <div class="text-center small">
                <a th:href="@{/login}" class="text-decoration-none">
                    <i class="bi bi-box-arrow-in-right me-1"></i>ログインはこちら
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
