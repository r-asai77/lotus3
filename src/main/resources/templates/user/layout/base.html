<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ja">

<!-- ===== HEAD fragment ===== -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' - Lotus'">Lotus</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #f5f7fb; }
        .navbar-brand { font-weight: 700; letter-spacing: .05em; }
        .nav-link.active { font-weight: 600; }
        .content-wrapper { min-height: calc(100vh - 56px); }
        .card { border: none; border-radius: 10px; box-shadow: 0 1px 8px rgba(0,0,0,.07); }
        .card-header { border-radius: 10px 10px 0 0 !important; font-weight: 600; }
    </style>
</head>

<!-- ===== HEADER fragment ===== -->
<body>
<nav th:fragment="header" class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand" th:href="@{/}">
            <i class="bi bi-flower1 me-1"></i>Lotus
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMain">
            <ul class="navbar-nav me-auto gap-1">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/information}">
                        <i class="bi bi-bell me-1"></i>インフォメーション
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/faq}">
                        <i class="bi bi-question-circle me-1"></i>FAQ
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/inquiry}">
                        <i class="bi bi-chat-dots me-1"></i>問い合わせ
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/seminar}">
                        <i class="bi bi-calendar-check me-1"></i>セミナー申込
                    </a>
                </li>
            </ul>
            <ul class="navbar-nav ms-auto align-items-center gap-2">
                <li class="nav-item">
                    <a class="nav-link text-white-50 small py-1 px-2 rounded" th:href="@{/account}">
                        <i class="bi bi-person-circle me-1"></i>
                        <span sec:authentication="name">ユーザー名</span> さん
                    </a>
                </li>
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="btn btn-outline-light btn-sm">
                            <i class="bi bi-box-arrow-right me-1"></i>ログアウト
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ===== ACCOUNT SIDEBAR fragment ===== -->
<div th:fragment="accountSidebar(active)">
    <div class="card mb-3">
        <div class="card-body px-3 py-3 text-center">
            <div class="rounded-circle bg-primary text-white d-inline-flex align-items-center justify-content-center mb-2"
                 style="width:56px;height:56px;font-size:1.5rem">
                <i class="bi bi-person-fill"></i>
            </div>
            <div class="fw-semibold" sec:authentication="name">ユーザー名</div>
            <div class="text-muted small">さん</div>
        </div>
    </div>
    <div class="list-group shadow-sm">
        <a th:href="@{/account}"
           th:class="${active == 'profile'} ? 'list-group-item list-group-item-action active d-flex align-items-center gap-2 py-3' : 'list-group-item list-group-item-action d-flex align-items-center gap-2 py-3'">
            <i class="bi bi-person-fill"></i>ユーザー情報
        </a>
        <a th:href="@{/account/billing}"
           th:class="${active == 'billing'} ? 'list-group-item list-group-item-action active d-flex align-items-center gap-2 py-3' : 'list-group-item list-group-item-action d-flex align-items-center gap-2 py-3'">
            <i class="bi bi-building"></i>請求先情報
        </a>
        <a th:href="@{/account/qualifications}"
           th:class="${active == 'qualifications'} ? 'list-group-item list-group-item-action active d-flex align-items-center gap-2 py-3' : 'list-group-item list-group-item-action d-flex align-items-center gap-2 py-3'">
            <i class="bi bi-patch-check-fill"></i>所持資格
        </a>
    </div>
</div>

<!-- ===== SCRIPTS fragment ===== -->
<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>

</body>
</html>
