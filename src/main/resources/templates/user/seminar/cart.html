<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head th:replace="~{user/layout/base :: head('申込情報入力')}"></head>
<body>

<nav th:replace="~{user/layout/base :: header}"></nav>

<div class="content-wrapper container-fluid px-4 py-4">

    <!-- ページタイトル -->
    <div class="mb-3">
        <h5 class="fw-bold mb-0"><i class="bi bi-cart3-fill text-warning me-2"></i>申込情報入力</h5>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb small mb-0">
                <li class="breadcrumb-item"><a th:href="@{/}" class="text-decoration-none">トップ</a></li>
                <li class="breadcrumb-item"><a th:href="@{/seminar}" class="text-decoration-none">セミナー申込</a></li>
                <li class="breadcrumb-item active">申込情報入力</li>
            </ol>
        </nav>
    </div>

    <!-- ステップ表示 -->
    <div class="d-flex align-items-center gap-0 mb-4 mx-auto" style="max-width:600px">
        <div class="text-center" style="flex:1">
            <div class="rounded-circle bg-primary text-white d-inline-flex align-items-center justify-content-center fw-bold" style="width:32px;height:32px;font-size:.85rem">1</div>
            <div class="small mt-1 fw-semibold text-primary">セミナー選択</div>
        </div>
        <div class="flex-grow-1 border-top border-2 border-primary mb-4"></div>
        <div class="text-center" style="flex:1">
            <div class="rounded-circle bg-primary text-white d-inline-flex align-items-center justify-content-center fw-bold" style="width:32px;height:32px;font-size:.85rem">2</div>
            <div class="small mt-1 fw-semibold text-primary">申込情報入力</div>
        </div>
        <div class="flex-grow-1 border-top border-2 border-secondary mb-4"></div>
        <div class="text-center" style="flex:1">
            <div class="rounded-circle bg-secondary text-white d-inline-flex align-items-center justify-content-center fw-bold" style="width:32px;height:32px;font-size:.85rem">3</div>
            <div class="small mt-1 text-muted">申込確認</div>
        </div>
        <div class="flex-grow-1 border-top border-2 border-secondary mb-4"></div>
        <div class="text-center" style="flex:1">
            <div class="rounded-circle bg-secondary text-white d-inline-flex align-items-center justify-content-center fw-bold" style="width:32px;height:32px;font-size:.85rem">4</div>
            <div class="small mt-1 text-muted">申込完了</div>
        </div>
    </div>

    <div class="row g-4">
        <!-- 申込情報フォーム -->
        <div class="col-md-7">
            <div class="card mb-4">
                <div class="card-header bg-white fw-semibold py-3">
                    <i class="bi bi-person-lines-fill me-2 text-primary"></i>申込者情報
                </div>
                <div class="card-body p-4">
                    <form>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">姓 <span class="text-danger">*</span></label>
                                <input type="text" class="form-control form-control-sm" value="山田" readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">名 <span class="text-danger">*</span></label>
                                <input type="text" class="form-control form-control-sm" value="太郎" readonly>
                            </div>
                            <div class="col-12">
                                <label class="form-label small fw-semibold">メールアドレス <span class="text-danger">*</span></label>
                                <input type="email" class="form-control form-control-sm" value="yamada@example.com" readonly>
                            </div>
                            <div class="col-12">
                                <label class="form-label small fw-semibold">電話番号 <span class="text-danger">*</span></label>
                                <input type="tel" class="form-control form-control-sm" placeholder="09012345678">
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card">
                <div class="card-header bg-white fw-semibold py-3">
                    <i class="bi bi-building me-2 text-primary"></i>請求先情報
                </div>
                <div class="card-body p-4">
                    <form>
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label small fw-semibold">請求先名 <span class="text-danger">*</span></label>
                                <input type="text" class="form-control form-control-sm" placeholder="会社名または個人名">
                            </div>
                            <div class="col-12">
                                <label class="form-label small fw-semibold">郵便番号</label>
                                <input type="text" class="form-control form-control-sm" placeholder="1234567">
                            </div>
                            <div class="col-12">
                                <label class="form-label small fw-semibold">住所</label>
                                <input type="text" class="form-control form-control-sm" placeholder="都道府県・市区町村・番地">
                            </div>
                            <div class="col-12">
                                <label class="form-label small fw-semibold">担当者名</label>
                                <input type="text" class="form-control form-control-sm" placeholder="担当者氏名">
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- カート内容 -->
        <div class="col-md-5">
            <div class="card sticky-top" style="top:80px">
                <div class="card-header bg-white fw-semibold py-3">
                    <i class="bi bi-cart3 me-2 text-warning"></i>カート（2件）
                </div>
                <div class="list-group list-group-flush">
                    <div class="list-group-item px-4 py-3">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <div class="small fw-semibold">資格A取得セミナー 応用コース</div>
                                <div class="small text-muted">
                                    <span class="badge bg-info text-dark me-1">セミナー</span>
                                    2026-07-17 / 大阪会場
                                </div>
                            </div>
                            <button class="btn btn-outline-danger btn-sm py-0 px-1 ms-2">
                                <i class="bi bi-x"></i>
                            </button>
                        </div>
                    </div>
                    <div class="list-group-item px-4 py-3">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <div class="small fw-semibold">資格B入門オンラインセミナー</div>
                                <div class="small text-muted">
                                    <span class="badge bg-success me-1">オンライン</span>
                                    2026-07-01〜07-31 / オンライン
                                </div>
                            </div>
                            <button class="btn btn-outline-danger btn-sm py-0 px-1 ms-2">
                                <i class="bi bi-x"></i>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="card-footer bg-white">
                    <div class="d-grid gap-2">
                        <a th:href="@{/seminar/confirm}" class="btn btn-primary">
                            <i class="bi bi-arrow-right me-1"></i>申込確認へ
                        </a>
                        <a th:href="@{/seminar}" class="btn btn-outline-secondary btn-sm">
                            <i class="bi bi-arrow-left me-1"></i>セミナー選択に戻る
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<th:block th:replace="~{user/layout/base :: scripts}"></th:block>
</body>
</html>
